name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The parser must never write to Claude Code's data directory. This is cheap
      # insurance against a regression that would be catastrophic and silent.
      - name: Assert no write paths into ~/.claude
        run: |
          if grep -rnE "writeFile|appendFile|createWriteStream|unlink|rmdir" \
               --include="*.ts" packages/ apps/ 2>/dev/null \
             | grep -v "__tests__\|\.test\.ts" \
             | grep -i "\.claude"; then
            echo "::error::Found a write path targeting ~/.claude — see CLAUDE.md rule 2"
            exit 1
          fi
          echo "OK: no write paths into ~/.claude"
